tcd_prg:
  config: ../../configs/config.yaml
  paths_config: ../../configs/local_paths.yaml
  perception_checkpoint: ../../outputs/perception_20260829_170103/best.pt
  grasp_checkpoint: ../../outputs/grasp_20260829_223035/grasp_best.pt
  push_evaluator_checkpoint: ""  # set this after a validated Stage-C run
  device: cuda

cameras:
  - id: mech_eye_pro_s
    enabled: true
    ip: 192.168.128.111
    # Map the only physical camera to Stage-B's trained reference view.
    model_view_index: 2
    # Reused from the previous experiment; legacy translation mm -> metres.
    camera_to_robot_base:
      - [0.7023924, -0.7085338, -0.06800514, -0.408696]
      - [-0.70047656, -0.70503266, 0.1107301, -0.215689]
      - [-0.12640189, -0.03013997, -0.9915209, 0.915415]
      - [0.0, 0.0, 0.0, 1.0]

fusion:
  workspace_min_m: [0.10, -0.50, -0.05]
  workspace_max_m: [0.95, 0.50, 0.65]
  # Required tabletop calibration in robot-base coordinates:
  # normal dot xyz + offset_m = 0. The normal must point upward.
  table_plane_base: {normal: [0.0, 0.0, 1.0], offset_m: 0.0}
  table_clearance_m: 0.003
  voxel_size_m: 0.005
  # Legacy training caches are variable-length (median about 62,076 points).
  # Cap dense captures to the median; never duplicate points from sparse captures.
  target_scene_points: 0  # retain valid capture; stage-specific sampling happens in the model
  point_sample_seed: 20260813
  instance_association_distance_m: 0.06
  instance_association_color_distance: 0.35
  temporal_instance_distance_m: 0.10
  depth_min_mm: 150
  depth_max_mm: 1500

segmentation:
  backend: external_command
  command: []    # append --input INPUT.npz --output OUTPUT.npz
  minimum_pixels: 200

robot:
  sdk_windows_root: ../../../fairino-python-sdk-3.7.6/windows
  ip: 192.168.58.2
  tool_id: 1
  user_id: 0
  model_tcp_to_robot_tcp:
    xyz_mm_rpy_deg: [0, 0, 0, 0, 0, 0]
  pregrasp_distance_m: 0.10
  lift_distance_m: 0.10
  push_distance_m: 0.15
  push_retreat_m: 0.05
  gripper_max_width_m: 0.095
  gripper_close_margin_m: 0.003
  gripper_index: 1
  gripper_company: 4
  gripper_device: 0
  gripper_softversion: 0
  gripper_bus: 0
  gripper_config_on_connect: true
  gripper_reset_on_connect: true
  gripper_activate_on_connect: true
  gripper_activate_delay_s: 3.0
  gripper_open_position: 100
  gripper_closed_position: 5
  gripper_speed: 48
  gripper_force: 100
  gripper_open_force: 100
  gripper_max_time_ms: 30000
  speed_percent: 10
  home_joints_deg: [56.061, -81.2, 116.975, -127.892, -90.329, -76.447]
  home_speed_percent: 10
  # Independent motion command gate; tighter than the perception crop if needed.
  motion_workspace_min_m: [0.10, -0.50, 0.00]
  motion_workspace_max_m: [0.95, 0.50, 0.65]
  removal_pose_mm_rpy_deg: [-397.7, 450.4, 124.4, -2.1, 1.0, -33.8]

task:
  default_category_id: 0
  default_region_id: 0
