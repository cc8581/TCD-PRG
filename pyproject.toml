[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcd-prg"
version = "0.1.0"
description = "Task-Conditioned Dependency-Aware Push-Remove-Grasp research framework"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.23,<3",
  "torch>=2.1",
  "torch-geometric>=2.6,<3",
  "h5py>=3.9",
  "PyYAML>=6",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
render = ["pybullet>=3.2.6", "trimesh>=4.0", "Pillow>=10"]
eval = ["pandas>=2.0", "matplotlib>=3.7", "seaborn>=0.13", "psutil>=5.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
tcd-prg-train = "tcd_prg.scripts.train:main"
tcd-prg-eval = "tcd_prg.scripts.evaluate:main"
tcd-prg-eval-global = "tcd_prg.scripts.evaluate_global_grasps:main"
tcd-prg-inspect = "tcd_prg.tools.inspect_sample:main"
tcd-prg-prefetch = "tcd_prg.scripts.prefetch:main"
tcd-prg-audit = "tcd_prg.tools.audit_dataset:main"
tcd-prg-infer = "tcd_prg.scripts.infer_state:main"
tcd-prg-replay = "tcd_prg.scripts.replay_sequence:main"
tcd-prg-generate-policy-candidates = "tcd_prg.scripts.generate_policy_candidates:main"
tcd-prg-export-paper = "tcd_prg.tools.export_paper:main"

[tool.setuptools.packages.find]
include = ["tcd_prg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_data: requires the local TaskOrientedClutterSceneDataset", "slow: long-running validation"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
