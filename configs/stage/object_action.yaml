# Stage B: keep sensor backbone/instance decomposition stable while learning actions.
defaults:
  - ../config.yaml
  - _self_

training:
  max_optimizer_steps: 18000
  generated_policy_candidate_ratio: 0.0
  frozen_modules: [encoder.scene_backbone, encoder.instance_head]

losses:
  instance: 0.0
  region: 1.0
  task_grasp: 1.0
  physical_edge: 0.5
  task_edge: 0.5
  verify_overall: 1.0
  push_object: 0.25
  push_contact: 0.25
  push_direction: 0.25
  push_potential: 0.25
  policy_candidate: 0.0
