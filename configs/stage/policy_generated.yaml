# Stage C：冻结全部前级网络，只用部署路径生成候选训练 Router。
defaults:
  - ../config.yaml
  - _self_

training:
  # ratio=1 会触发 generated coverage 启动检查，并走精简的 policy-only forward。
  frozen_modules: [encoder, region_head, task_grasp, verifier, graph, push]
  generated_policy_candidate_cache: runtime/cache/policy_candidates
  generated_policy_candidate_ratio: 1.0
  generated_policy_checkpoint_sha256: ""

losses:
  instance: 0.0
  region: 0.0
  task_grasp: 0.0
  physical_edge: 0.0
  task_edge: 0.0
  verify_overall: 0.0
  push_object: 0.0
  push_contact: 0.0
  push_direction: 0.0
  push_potential: 0.0
  policy_candidate: 1.0
