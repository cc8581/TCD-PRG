# Prerequisite perception/target training before manipulation-head training.
defaults:
  - ../config.yaml
  - _self_

training:
  max_optimizer_steps: 10000
  generated_policy_candidate_ratio: 0.0
  frozen_modules: []

losses:
  instance: 1.0
  region: 1.0
  task_grasp: 0.0
  physical_edge: 0.0
  task_edge: 0.0
  verify_overall: 0.0
  push_object: 0.0
  push_contact: 0.0
  push_direction: 0.0
  push_potential: 0.0
  policy_candidate: 0.0
