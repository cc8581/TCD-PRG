# Stage B: frozen perception, binary TaskGraspEvaluator training only.
defaults:
  - ../config.yaml
  - _self_

training:
  stage: grasp
  max_optimizer_steps: 15000
  frozen_modules: [encoder, region_head, graspnet, push]

  max_train_groups: null
  max_validation_groups: null
  batch_size: 8
  gradient_accumulation_steps: 1
  validation_interval: 1000

losses:
  instance: 0.0
  region: 0.0
  task_grasp: 1.0
  push_object: 0.0
  push_contact: 0.0
  push_direction: 0.0
  push_potential: 0.0
