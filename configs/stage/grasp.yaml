# Stage B: checkpoint-independent binary TaskGraspEvaluator training.
defaults:
  - ../config.yaml
  - _self_

dataset:
  stageb_binary_root: runtime/stageb_binary
  stageb_source: acronym_dynamic
  stageb_acronym_root: ''
  stageb_positive_per_state: 8
  stageb_negative_per_state: 16

optimizer:
  learning_rate: 0.0001
  weight_decay: 0.01

scheduler:
  warmup_steps: 2000

training:
  pretrain_checkpoint: null
  stage: grasp
  max_optimizer_steps: 15000
  frozen_modules: [encoder, region_head, graspnet, push]

  max_train_groups: null
  max_validation_groups: null
  batch_size: 8
  gradient_accumulation_steps: 1
  validation_interval: 1000
  validation_scene_count: null
  allowed_action_strata: []
  action_batch_coverage_strata: []
  unfreeze_at_optimizer_step: null
  amp: true
  amp_dtype: float16
  amp_initial_scale: 4096
  gradient_clip_norm: 20.0
  ema_decay: 0.999
  early_stopping_patience: 15
  num_workers: 8
  validation_num_workers: 0
  pin_memory: true
  validation_scene_seed: 2026
  ddp_backend: auto
  ddp_find_unused_parameters: false
  validation_family_weights: {task_grasp: 0.25}

losses:
  instance: 0.0
  region: 0.0
  task_grasp: 1.0
  push_object: 0.0
  push_contact: 0.0
  push_direction: 0.0
  push_potential: 0.0
  internal:
    task_grasp_bce: 1.0

logging:
  backend: tensorboard
  log_interval: 20
  validation_log_interval: 20
  gradient_diagnostics_interval: 200
