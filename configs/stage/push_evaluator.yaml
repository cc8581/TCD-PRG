# Fine-tune the complete yanx27 S3DIS PointNet++ evaluator; no perception weights.
defaults:
  - ../config.yaml
  - _self_

dataset:
  # 仅覆盖 PushEvaluator 的原始场景点数，可调整为 4096 或 1024。
  # FPS 的网络输入点数由下面 training.push_fps_points 单独设置。
  scene_points: 16384

optimizer:
  learning_rate: 0.0001
  weight_decay: 0.01

scheduler:
  warmup_steps: 2000

training:
  push_value_root: runtime/push_value/action
  push_value_horizons: 5
  push_q_loss_weight: 1.0
  push_rank_loss_weight: 0.25
  push_safety_loss_weight: 0.5
  push_aux_loss_weight: 0.1
  push_rank_margin: 0.02
  push_delta_scales: [10.0, 1.0, 1.0, 5.0, 1.0]
  # 网络输入点数，可改为 1024 等；应不大于上面的 scene_points（0 表示不限）。
  push_fps_points: 16384
  pretrain_checkpoint: null       # null: load published yanx27 backbone; otherwise a new-protocol PUSH checkpoint.
  stage: push_evaluator
  max_optimizer_steps: 10000
  validation_interval: 1000
  # 验证 batch 由代码固定为该值的 2 倍；RTX 3090 实测 32/64 在验证首批 OOM。
  batch_size: 8
  gradient_accumulation_steps: 1
  amp: false  # Explicit FP32 PointNet++ training.
  max_train_groups: null
  max_validation_groups: null
  validation_scene_count: 20
  allowed_action_strata: [push, push_failure]
  action_batch_coverage_strata: [push, push_failure]
  num_workers: 8
  pin_memory: true

evaluation:
  push_match_contact_m: 0.024
  push_match_direction_deg: 15.0
  instance_match_iou_threshold: 0.5
