# Train the independent PUSH evaluator with PTv3 (primary) or PointNet++ (fallback).
defaults:
  - ../config.yaml
  - _self_

backbone:
  pretrained_checkpoint: .deps/checkpoints/sonata_20251024.pth
  pretrained_format: sonata
  pretrained_sha256: "8aab33915ddfec2628da10ee1236ace7ed720b7ebba0dd9bc86f9ca7f9de102f"
  pretrained_required: true
  pretrained_min_parameter_fraction: 0.99
  # Fine-tune Sonata and PUSH heads together from step 0 at the configured LR.
  pretrained_freeze_steps: 0

dataset:
  # Stage-C uses 1024 scene points for both loading and backbone input.
  # FPS 的网络输入点数由下面 training.push_fps_points 单独设置。
  scene_points: 1024

optimizer:
  # Train the selected geometry backbone and PUSH heads together.
  learning_rate: 0.0005
  backbone_learning_rate: 0.0005
  weight_decay: 0.01

scheduler:
  warmup_steps: 2000

training:
  # Primary: point_transformer_v3. Controlled fallback: pointnet2.
  push_backbone: point_transformer_v3
  # build_push_improvement.py output: successful-sequence membership labels.
  push_improvement_root: runtime/push_improvement/action
  # reweight/reweight_undersample 模式的正类 BCE 权重。
  push_improvement_pos_weight: 6.25
  # 正类权重 6.25 与负类欠采样同时启用；验证始终保留原始类别分布。
  push_class_balance_mode: reweight_undersample
  # 1/5 对应抽样后正负约 1:4。
  push_positive_fraction: 0.2
  # 网络输入点数，可改为 1024 等；应不大于上面的 scene_points（0 表示不限）。
  push_fps_points: 1024
  pretrain_checkpoint: null       # null: use configured backbone initialization; otherwise a matching PUSH checkpoint.
  stage: push_evaluator
  max_optimizer_steps: 60000
  validation_interval: 2000
  # 验证 batch 由代码固定为该值的 2 倍；RTX 3090 实测 32/64 在验证首批 OOM。
  batch_size: 24
  gradient_accumulation_steps: 1
  amp: false  # Stage-C currently uses explicit FP32 training.
  max_train_groups: null
  max_validation_groups: null
  validation_scene_count: 20
  # Sequence-membership supervision includes unexecuted PUSH candidates too.
  allowed_action_strata: []
  action_batch_coverage_strata: []
  num_workers: 8
  pin_memory: true

evaluation:
  push_match_contact_m: 0.024
  push_match_direction_deg: 15.0
  instance_match_iou_threshold: 0.5
