# Run only after the matching Stage-C proposal checkpoint exists.
defaults:
  - ../stage/push_evaluator.yaml
  - _self_

training:
  seed: 2026
  deterministic: true
  batch_size: 4
  max_optimizer_steps: 2000
  validation_interval: 200
  num_workers: 0
  max_train_groups: 200
  max_validation_groups: 200
  push_overfit_validate_train: true

optimizer:
  learning_rate: 0.001
  backbone_learning_rate: 0.0001
  weight_decay: 0.0

scheduler:
  warmup_steps: 100
