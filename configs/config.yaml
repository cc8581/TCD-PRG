defaults:
  - _self_

dataset:
  root: ${oc.env:TCD_DATASET_ROOT,data/TaskOrientedClutterSceneDataset}
  acronym_root: ${oc.env:TCD_ACRONYM_ROOT,data/ACRONYM}
  functional_region_root: ${oc.env:TCD_FUNCTIONAL_REGION_ROOT,data/manual_function_regions_v1}
  fr5_ag_urdf: ${oc.env:TCD_ROBOT_URDF,assets/robots/FR5_AG-160-95/urdf/fr5_ag160_95.urdf}
  adapter: task_oriented_clutter
  scene_subdir: task_clutter_scenes_20_categories
  step_labels_subdir: task_training_labels_steps1_6_v1
  action_labels_subdir: task_positive_multistep_sequences
  global_grasp_library_subdir: generic_grasp_library_v1
  global_grasp_certification_subdir: global_grasp_scene_certification_v2
  pick_remove_global_association_subdir: pick_remove_global_grasp_association_v1
  scene_points: 16384
  target_points: 4096
  include_rgb: true
  allowed_camera_types: [mech_eye_pro_s]
  oracle_camera_types: [oracle]
  temporary_snapshot: true

observation:
  provider: cached
  render_width: 320
  render_height: 200
  camera_profile: mecheye_pro_s_three_view
  renderer_version: tcd_prg_pybullet_v1
  pybullet_python: ${oc.env:TCD_PYBULLET_PYTHON,python}
  worker_script: scripts/render_observation_worker_py38.py
  runtime_mesh_root: runtime/cache/meshes
  gripper_worker_script: scripts/sample_gripper_worker_py38.py
  gripper_cache_dir: runtime/cache/grippers
  allow_render_on_cache_miss: false
  certification_worker_script: scripts/certify_actions_worker_py38.py
  render_temporary_root: runtime/tmp/render_requests
  certification_temporary_root: runtime/tmp/certification

cache:
  enabled: true
  directory: runtime/cache/observations
  max_gb: 15
  min_free_gb: 20
  eviction: lru
  prefetch_workers: 4

backbone:
  name: task_conditioned_point_transformer
  pretrained_checkpoint: null
  freeze: false
  attention_points: 1024

region_head:
  enabled: true
  focal_alpha: 0.25
  focal_gamma: 2.0
  dice_weight: 1.0
  visibility_threshold: 0.5

grasp_proposal:
  task_conditioned: true
  predict_width: true
  recall_k: [1, 5, 10]

model:
  feature_dim: 256
  task_dim: 128
  num_categories: 64
  num_task_regions: 64
  num_relation_types: 8
  num_direction_bins: 16
  contact_heatmap_sigma_m: 0.008
  min_grasp_width_m: 0.0
  max_grasp_width_m: 0.095
  candidate_topk: 64
  task_grasp_candidates: 64
  global_grasp_candidates: 64
  pick_remove_candidates: 16
  push_candidates: 16
  activation_checkpointing: true
  verifier_local_scene_points: 512
  verifier_gripper_points: 512
  verifier_local_radius_m: 0.25
  verifier_candidate_micro_batch: 16
  verifier_validity_threshold: 0.5
  graph_edge_threshold: 0.5
  default_required_grasp_count: 20
  max_required_grasp_count: 20
  grasp_nms_translation_m: 0.010
  grasp_nms_rotation_deg: 12.0
  grasp_nms_width_m: 0.005
  grasp_nms_approach_deg: 12.0
  graph_candidate_fallback_objects: 1
  allow_target_push_recovery: true
  global_grasp_input_mode: scene_only
  global_grasp_nms_translation_m: 0.01
  global_grasp_nms_rotation_deg: 15.0
  global_grasp_nms_width_m: 0.005
  global_grasp_nms_approach_deg: 15.0
  push_utility_component_weights: [0.05, 1.0, -1.0, -0.25, 1.0]
  push_failure_penalties: [1.0, 2.0, 1.0]

grasp_verifier:
  local_scene_points: 512
  gripper_points: 512
  candidate_micro_batch: 16

graph:
  physical_relations: [near, contact, support, press, occlude]
  task_relations: [block_task_region, block_task_grasp, block_grasp_approach]
  layers: 3
  heads: 4

push:
  distance_m: 0.15
  direction_bins: 16

pick_remove:
  enabled: true
  macro_action: true
  deactivate_after_success: true

router:
  type: hierarchical
  layers: 2
  heads: 4
  max_preparation_actions: 5

losses:
  region: 1.0
  task_grasp: 1.0
  global_grasp: 1.0
  physical_edge: 1.0
  task_edge: 1.0
  verify_overall: 1.0
  push_object: 1.0
  push_contact: 1.0
  push_direction: 1.0
  push_potential: 1.0
  policy_candidate: 1.0
  internal:
    region_focal: 1.0
    region_dice: 1.0
    region_visibility: 0.2

sampling:
  positive_grasps: 8
  wrong_region_grasps: 8
  collision_or_approach_negative_grasps: 8
  perturbed_negative_grasps: 4
  global_positive_grasps_per_object: 64
  global_intrinsic_negative_grasps_per_object: 32
  global_scene_negative_grasps_per_object: 32
  unit: action_state_group

optimizer:
  name: adamw
  learning_rate: 0.0001
  backbone_learning_rate: 0.00002
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 2000

training:
  seed: 2026
  device: cuda
  amp: true
  amp_dtype: float16
  batch_size: 1
  gradient_accumulation_steps: 8
  candidate_micro_batch: 16
  max_optimizer_steps: 100000
  validation_interval: 1000
  checkpoint_interval: 1000
  gradient_clip_norm: 1.0
  ema_decay: 0.999
  early_stopping_patience: 20
  deterministic: true
  num_workers: 4
  pin_memory: true
  validation_fraction: 0.1
  max_validation_groups: 256
  max_train_groups: null
  frozen_modules: []
  unfreeze_at_optimizer_step: null
  ddp_backend: auto
  ddp_find_unused_parameters: true
  validation_family_weights:
    policy_candidate: 1.0
    verify_overall: 0.5
    physical_edge: 0.25
    task_edge: 0.25
    task_grasp: 0.25
    global_grasp: 0.25
    region: 0.1
    push_object: 0.1
    push_contact: 0.05
    push_direction: 0.05
    push_potential: 0.1

evaluation:
  max_preparation_actions: 5
  horizons: [0, 1, 3, 5]
  bootstrap_samples: 1000
  confidence: 0.95
  max_groups: null
  global_grasp_tracks: [scene_only, instance_assisted]
  global_translation_threshold_m: 0.01
  global_rotation_threshold_deg: 15.0
  global_width_threshold_m: 0.005
  global_metrics_after_nms: true

ablation:
  use_task_region_condition: true
  use_dependency_graph: true
  use_indirect_dependency_reasoning: true
  use_gripper_scene_verifier: true
  use_push_potential: true
  router_type: hierarchical

logging:
  backend: tensorboard
  log_interval: 20
  save_resolved_config: true
  save_git_commit: true

reproducibility:
  deterministic: true
  cudnn_benchmark: false

planner:
  reobserve_after_action: true
  exact_certification: true
  max_preparation_actions: 5
  reject_and_rerank: true

baseline:
  type: tcd_prg
  gapg_root: .
  grasp_checkpoint: pretrain_models/grasp_model.pt
  push_checkpoint: pretrain_models/push_model.pt
  graspnet_checkpoint: .deps/checkpoints/graspnet-rs.tar

push_distance_m: 0.15
output_dir: outputs/full
