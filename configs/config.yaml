defaults:
  - _self_

dataset:
  # 下列三个路径会被 train.py 的本机路径配置覆盖，此处保留可移植的仓库相对值。
  root: data/TaskOrientedClutterSceneDataset
  acronym_root: data/ACRONYM
  functional_region_root: data/manual_function_regions
  fr5_ag_urdf: assets/robots/FR5_AG-160-95/urdf/fr5_ag160_95.urdf
  adapter: task_oriented_clutter
  scene_subdir: task_clutter_scenes_20_categories
  step_labels_subdir: task_training_labels
  action_labels_subdir: task_positive_multistep_sequences
  # 0 表示保留三视角融合后的全部有效点；PTv3 内部使用 5 mm GridSample 变长打包。
  scene_points: 16384

observation:
  # 正式训练使用有界 LRU：命中直读，cache miss 由 DataLoader worker 按需渲染。
  provider: cached
  # 离线点云全部生成并校验后设为 false。严格模式下 cache miss 直接报错，
  # 训练启动时也不会执行 LRU eviction，从而避免删除离线预生成缓存。
  allow_render_on_miss: false
  render_width: 320
  render_height: 200
  camera_profile: mecheye_pro_s_three_view
  # Foreground-only legacy cache contract. Real deployment must apply the same
  # workspace crop and table/background removal before model inference.
  renderer_version: tcd_prg_pybullet_v5_sensor_valid_depth_10k_per_view
  # Scenes rendered before the bounded 10k/view protocol retain their exact
  # v4 cache identity. Later scenes use renderer_version above.
  renderer_by_scene:
    '0': tcd_prg_pybullet_v5_sensor_valid_depth_10k_per_view
    '1': tcd_prg_pybullet_v5_sensor_valid_depth_10k_per_view
