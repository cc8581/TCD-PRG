  worker_script: scripts/render_observation_worker_py38.py
  runtime_mesh_root: runtime/cache/meshes
  certification_worker_script: scripts/certify_actions_worker_py38.py
  render_temporary_root: runtime/tmp/render_requests
  certification_temporary_root: runtime/tmp/certification

# Online training-only point-cloud augmentation. Validation and inference never use it.
augmentation:
  debug:
    save_first_batches: 3
  # 颜色与纹理增强
  zero_rgb:
    probability: 0.10
  grayscale:
    probability: 0.10
  color_jitter:
    probability: 0.30
    brightness: 0.35
    contrast: 0.35
    saturation: 0.35
    hue: 0.08
    gamma: [0.75, 1.35]
  object_recolor:
    probability: 0.35
    strength: [0.35, 0.90]
  material_jitter:
    probability: 0.30
    noise_std: [0.01, 0.08]
  lighting_jitter:
    probability: 0.30
    gain: [0.65, 1.35]
    bias: [-0.12, 0.12]
  sensor_noise:
    probability: 0.30
    std: [0.005, 0.04]
  channel_dropout:
    probability: 0.2        # default 0.2

  # 几何与深度增强
  point_dropout:
    probability: 0.0        # default 0.3
    fraction: [0.01, 0.15]
  depth_noise:
    probability: 0.00       # default 0.30
    std_m: [0.0005, 0.0030]
  hole_dropout:
    probability: 0.0       # default 0.20
    count: [1, 3]
    radius_m: [0.008, 0.030]
  outlier_injection:
    probability: 0.0       # default 0.15
    fraction: [0.01, 0.02]
    displacement_m: [0.005, 0.050]
  view_dropout:
    probability: 0.0        # default 0.1
    max_views: 1
  density_variation:
    probability: 0.0       # default 0.20
    keep_ratio: [0.60, 0.95]
  extrinsic_jitter:
    probability: 0.0       # default 0.20
    translation_std_m: [0.0005, 0.0030]
    rotation_degrees: [0.10, 1.00]
  occlusion:
    probability: 0.0       # default 0.20
    fraction: [0.05, 0.20]

cache:
  # eviction_enabled=false 时空间不足会报错停止，绝不删除已有缓存。
  directory: runtime/cache/observations
  max_gb: 10
  min_free_gb: 10
  eviction_enabled: false
  prefetch_workers: 4

backbone:
  # 官方 Pointcept PTv3。Windows 默认走标准注意力；Linux/CUDA 可按环境开启 FlashAttention。
  backend: point_transformer_v3
  source_root: third_party/PointTransformerV3
  grid_size_m: 0.005
  # Windows CUDA 11/12 wheels use standard attention; enable only in a
  # version-matched Linux environment with FlashAttention installed.
  enable_flash_attention: false
  patch_size: 128
  attention_points: 1024

graspnet:
  # Frozen official graspnet-baseline; external to TCD-PRG checkpoint/EMA.
  source_root: .deps/graspnet-baseline
  checkpoint: .deps/checkpoints/graspnet-rs.tar
  # false enables only the separate dense-label GraspNet fine-tuning API;
  # Stage-B training reads frozen proposal records and never executes this network.
  freeze: true
  scene_input_points: 20000
  target_input_points: 20000
  camera_view_index: 2
  target_crop_probability: 0.5
  target_min_crop_points: 16
  camera_transfer_max_distance_m: 0.010
  global_proposals: 128
  target_proposals: 128
  target_selection_mode: quality_diverse
  global_selection_mode: quality_topk
  diversity_quality_fraction: 0.5
  diversity_translation_m: 0.010
  diversity_rotation_deg: 12.0
  diversity_pool_factor: 4
  num_view: 300
  num_angle: 12
  num_depth: 4
  cylinder_radius: 0.05
  hmin: -0.02
  hmax_list: [0.01, 0.02, 0.03, 0.04]

model:
  # 各动作 head 共享 256 维场景特征，避免重复执行点云骨干。
  feature_dim: 256
  task_dim: 128
  num_categories: 64
  num_task_regions: 64
  # Lightweight query-based instance decomposition on shared PTv3 features.
  instance_queries: 32
  instance_decoder_layers: 6
  instance_decoder_heads: 8
  instance_objectness_threshold: 0.5
  instance_matching_points: 2048
  target_query_temperature: 0.25
  # V2 target identity: one positive 3D point by default; P>1 supports future negatives.
  target_prompt_radius_m: 0.030
  target_prompt_sigma_m: 0.012
  target_prompt_jitter_std_m: 0.003
  target_prompt_weight: 4.0
  target_category_weight: 1.0
  target_objectness_weight: 0.5
  target_center_weight: 0.5
  target_learned_weight: 0.20
  target_reid_weight: 0.75
  target_reid_center_weight: 0.35
  target_reid_max_center_distance_m: 0.15
  target_prompt_min_support: 0.20
  target_prompt_min_margin: 0.25
  target_same_category_loss_boost: 2.0
  num_direction_bins: 16
  contact_heatmap_sigma_m: 0.008
  push_contact_match_max_distance_m: 0.024
  min_grasp_width_m: 0.0
  max_grasp_width_m: 0.095
  candidate_topk: 64
  task_grasp_candidates: 32
  task_grasp_probability_threshold: 0.5 # 运行时至少一个高置信任务抓取即可尝试认证
  pick_remove_probability_threshold: 0.5 # 低置信移除不得压过 Push
  # GraspNet 产生 6DoF proposal；任务评分器只学习任务残差。
  task_grasp_scene_points: 256
  task_grasp_gripper_points: 128
  task_grasp_gripper_geometry: assets/robots/FR5_AG-160-95/ag16095_open_tcp_128.npz
  stageb_label_gripper_geometry: assets/robots/FR5_AG-160-95/ag16095_open_tcp_4096.npz
  pick_remove_candidates: 16
  push_candidates: 16
  push_directions_per_contact: 2  # 每个接触点展开 Top-2 方向
  max_push_candidates: 32         # 展开后保留的最终 PUSH 候选上限
  push_direction_contact_topk: 32 # 每个预测实例仅对 Top-K 预测接触点计算方向/utility
  push_object_topk: 4              # 推理时只展开最高分的 Push 作用对象
  push_utility_threshold: 0.0
  push_candidate_probability_threshold: 0.0
  push_utility_temperature: 1.0
  pick_remove_target_margin_m: 0.05 # 仅移除预测目标邻域内的非目标物体
  push_direction_feature_dim: 64
  push_direction_transformer_layers: 1
  push_direction_transformer_heads: 4
  activation_checkpointing: false # 显存不足时再开启；开启会重复计算 PTv3 前向
  grasp_nms_translation_m: 0.010
  grasp_nms_rotation_deg: 12.0
  grasp_nms_width_m: 0.005
  grasp_nms_approach_deg: 12.0
  global_grasp_nms_translation_m: 0.01
  global_grasp_nms_rotation_deg: 15.0
  global_grasp_nms_width_m: 0.005
  global_grasp_nms_approach_deg: 15.0
  # Task Grasp proposal 与监督抓取的匹配阈值。
  # 同物体 PUSH 的动作级 NMS 阈值。
  push_nms_contact_m: 0.015
  push_nms_direction_deg: 15.0
  push_utility_component_weights: [0.05, 1.0, -1.0, -0.25, 1.0]
  push_failure_penalties: [1.0, 2.0, 1.0]

sampling:
  # 这些是每个 action-state group 的采样配额，不代表标签集合已经穷举完备。
  wrong_region_grasps: 8
  collision_or_approach_negative_grasps: 8
  global_positive_grasps_per_object: 64
  global_negative_grasps_per_object: 32

training:
  seed: 2026
  device: cuda
  deterministic: False
  scene_start: 0
  scene_count: 2500
  data_fraction: 1.0         # Use every scene in the configured snapshot.
  split_ratios: [9, 1]      # Deterministic scene-level 90/10 train/val split.
evaluation:
  bootstrap_samples: 1000
  confidence: 0.95
  max_groups: null
  region_probability_threshold: 0.5
  calibration_bins: 15

ablation:
  use_task_region_condition: true
  use_push_potential: true
baseline:
  type: tcd_prg
  gapg_root: third_party/GAPG
  grasp_checkpoint: .deps/checkpoints/gapg/grasp_model.pt
  push_checkpoint: .deps/checkpoints/gapg/push_model.pt
  graspnet_checkpoint: .deps/checkpoints/graspnet-rs.tar

output_dir: outputs/full
